[project]
name = "yandex-business-mcp"
version = "0.1.0"
description = "MCP server и CLI для управления сетью филиалов в Яндекс Бизнесе через официальный XML-фид"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nikolay Mokhnachev" }]
keywords = ["mcp", "yandex", "yandex-business", "sprav", "yandex-maps", "local-seo"]
dependencies = [
    # mcp 2.0 renamed mcp.server.fastmcp -> the server would fail on import.
    "mcp>=1.0.0,<2",
    "lxml>=5",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/nikolaymokh-dev/yandex-business-mcp"
Repository = "https://github.com/nikolaymokh-dev/yandex-business-mcp"

[project.scripts]
yandex-business-mcp = "yandex_business_mcp:main"
ybiz = "yandex_business_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yandex_business_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
